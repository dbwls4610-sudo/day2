<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 오름 추천 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
      background: #f3f4f6;
    }
    header {
      background: #16a34a;
      color: #fff;
      text-align: center;
      padding: 14px;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .me {
      align-self: flex-end;
      background: #fde047;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 20px;
    }
    button {
      padding: 10px 18px;
      font-size: 1rem;
      border: 0;
      border-radius: 20px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #15803d; }
    .note {
      text-align: center;
      font-size: 0.7rem;
      color: #9ca3af;
      padding: 4px 8px 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>🌿 제주 오름 추천 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 나오는 답변은 진짜 AI가 아닌 가짜(데모) 답변입니다.</div>

  <script>
    const replies = [
      '안녕하세요! 저는 지금 위치와 날씨를 보고 갈 만한 오름을 추천해 드리는 에이전트예요 🌿\n지금 어느 지역에 계신가요? 그리고 가볍게 걷고 싶은지, 제대로 오르고 싶은지도 알려 주세요!',
      '오늘처럼 맑은 날에는 용눈이오름을 추천해요 ⛰️\n완만한 능선이라 어렵지 않게 오를 수 있고, 정상에서 보는 풍경이 정말 좋아요.',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    let turn = 0;

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'me');
      input.value = '';
      const answer = replies[turn % replies.length];
      turn++;
      setTimeout(() => addMessage(answer, 'bot'), 1000);
    });
  </script>
</body>
</html>
